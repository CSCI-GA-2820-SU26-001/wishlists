apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: wishlist-cd
spec:
  description: Clone, lint, test, build, deploy, and run BDD tests for the Wishlist service.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: master
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/wishlist:latest
    - name: base-url
      type: string
      default: https://wishlist-kongzei-dev.apps.rm1.0a51.p1.openshiftapps.com/
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        name: wishlist-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: lint
      runAfter: [clone]
      taskRef:
        name: wishlist-lint
      workspaces:
        - name: source
          workspace: source

    - name: test
      runAfter: [clone]
      taskRef:
        name: wishlist-test
      workspaces:
        - name: source
          workspace: source

    - name: build
      runAfter: [lint, test]
      taskRef:
        name: wishlist-build
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      runAfter: [build]
      taskRef:
        name: wishlist-deploy
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source

    - name: bdd
      runAfter: [deploy]
      taskRef:
        name: wishlist-bdd
      params:
        - name: base-url
          value: $(params.base-url)
      workspaces:
        - name: source
          workspace: source
