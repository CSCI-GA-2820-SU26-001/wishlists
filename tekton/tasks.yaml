apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-clone
spec:
  description: Clone the requested revision into the shared source workspace.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: master
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:v2.45.2
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu
        export HOME=/tmp
        rm -rf ./* ./.??* || true
        git config --global --add safe.directory "$(workspaces.source.path)"
        git init
        git remote add origin "$REPO_URL"
        git fetch --depth 1 origin "$REVISION"
        git checkout --detach FETCH_HEAD

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-lint
spec:
  description: Run code quality checks.
  workspaces:
    - name: source
  steps:
    - name: lint
      image: quay.io/rofrano/nyu-devops-base:sp26
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail
        export HOME=/tmp
        export XDG_CACHE_HOME=/tmp/.cache
        export PIP_CACHE_DIR=/tmp/pip-cache
        python -m pip install --disable-pip-version-check pipenv
        pipenv sync --system --dev
        python -m flake8 service tests features --per-file-ignores='features/steps/*.py:F811 service/models/__init__.py:F401'
        python -m pylint service tests || true

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-test
spec:
  description: Install development dependencies and run the unit test suite.
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: quay.io/rofrano/nyu-devops-base:sp26
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: postgresql+psycopg://postgres:postgres@postgres:5432/wishlists
      script: |
        #!/bin/bash
        set -euo pipefail
        export HOME=/tmp
        export XDG_CACHE_HOME=/tmp/.cache
        export PIP_CACHE_DIR=/tmp/pip-cache
        python -m pip install --disable-pip-version-check pipenv
        pipenv sync --system --dev
        python -m pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-build
spec:
  description: Build the Wishlist image using the OpenShift BuildConfig.
  workspaces:
    - name: source
  steps:
    - name: build
      image: quay.io/openshift/origin-cli:4.16
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        if ! oc get buildconfig wishlist >/dev/null 2>&1; then
          oc new-build --name=wishlist --binary --strategy=docker
        fi
        oc start-build wishlist --from-dir="$(workspaces.source.path)" --follow

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-deploy
spec:
  description: Deploy PostgreSQL, Wishlist service, and OpenShift Route.
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/wishlist:latest
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.16
      workingDir: $(workspaces.source.path)
      env:
        - name: TARGET_IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        oc apply -f k8s/postgres/service.yaml
        oc apply -f k8s/postgres/statefulset.yaml
        oc apply -f k8s/service.yaml
        oc apply -f k8s/deployment.yaml
        oc apply -f openshift/route.yaml

        oc set image deployment/wishlist wishlist="$TARGET_IMAGE"

        oc set env deployment/wishlist \
          FLASK_APP=wsgi:app \
          PORT=8080 \
          DATABASE_URI=postgresql+psycopg://postgres:postgres@postgres:5432/wishlists

        oc rollout status deployment/wishlist --timeout=180s

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wishlist-bdd
spec:
  description: Run Selenium BDD tests against the deployed OpenShift Route.
  params:
    - name: base-url
      type: string
  workspaces:
    - name: source
  steps:
    - name: bdd
      image: quay.io/rofrano/pipeline-selenium:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: BASE_URL
          value: $(params.base-url)
      script: |
        #!/bin/bash
        set -euo pipefail
        export HOME=/tmp
        export XDG_CACHE_HOME=/tmp/.cache
        export PIP_CACHE_DIR=/tmp/pip-cache
        python -m pip install --disable-pip-version-check pipenv
        pipenv sync --system --dev
        python -m behave
